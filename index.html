<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P.A. – Gestión de Academia de Música</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js para Estadísticas de Finanzas -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background-color: #334155;
      border-radius: 4px;
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

  <!-- ========================================== -->
  <!-- BLOQUE 1: AUTENTICACIÓN / LOGIN Y REGISTRO -->
  <!-- ========================================== -->
  <div id="auth-screen" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8 max-w-md w-full relative">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-cyan-500/10 text-cyan-400 mb-3">
          <i data-lucide="music" class="w-8 h-8"></i>
        </div>
        <h1 class="text-2xl font-bold text-white">Proyecto Academia (P.A.)</h1>
        <p class="text-sm text-slate-400 mt-1">Gestión integral de Academia de Música</p>
      </div>

      <!-- Formularios de Auth -->
      <div id="auth-forms">
        <!-- Formulario Login -->
        <form id="form-login" onsubmit="event.preventDefault(); loginUser();" class="space-y-4">
          <h2 class="text-lg font-semibold text-slate-200">Iniciar Sesión</h2>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Usuario / Email</label>
            <input type="text" id="login-user" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500" placeholder="usuario@ejemplo.com" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Contraseña</label>
            <input type="password" id="login-pass" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500" placeholder="••••••••" />
          </div>
          <div class="flex items-center text-xs text-slate-400">
            <input type="checkbox" id="login-terms" required class="mr-2 rounded border-slate-700 bg-slate-800 text-cyan-500" />
            <label for="login-terms">Acepto los <a href="#" onclick="openModal('modal-terms')" class="text-cyan-400 underline">Términos y Condiciones</a> y la <a href="#" onclick="openModal('modal-privacy')" class="text-cyan-400 underline">Política de Privacidad</a></label>
          </div>
          <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-2 rounded-lg text-sm transition">Ingresar al Programa</button>
          
          <div class="flex justify-between text-xs text-slate-400 pt-2 border-t border-slate-800">
            <button type="button" onclick="toggleAuthForm('register')" class="hover:text-cyan-400">Crear cuenta nueva</button>
            <button type="button" onclick="toggleAuthForm('recover')" class="hover:text-cyan-400">¿Olvidaste tu contraseña?</button>
          </div>
        </form>

        <!-- Formulario Registro -->
        <form id="form-register" onsubmit="event.preventDefault(); registerUser();" class="space-y-4 hidden">
          <h2 class="text-lg font-semibold text-slate-200">Registro de Cuenta</h2>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Nombre Completo</label>
            <input type="text" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Correo Electrónico</label>
            <input type="email" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Contraseña</label>
            <input type="password" required class="w-full bg-slate-800 border border-
